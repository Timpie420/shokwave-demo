<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shokwave — Rijscherm</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #050505;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 20px 0;
  }

  @keyframes breatheWide { 0%,100%{opacity:0.35;} 50%{opacity:0.75;} }
  @keyframes flicker { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
  @keyframes needleSweep {
    0% { transform: rotate(-100deg); }
    55% { transform: rotate(18deg); }
    70% { transform: rotate(9deg); }
    85% { transform: rotate(14deg); }
    100% { transform: rotate(12deg); }
  }
  @keyframes drift { 0%{ transform: translateY(0);} 50%{ transform: translateY(-4px);} 100%{transform: translateY(0);} }
  .glow-pulse { animation: breatheWide 3s ease-in-out infinite; }
  .dot-flick { animation: flicker 1.8s ease-in-out infinite; }
  .needle { animation: needleSweep 1.8s cubic-bezier(.2,.9,.3,1) forwards; transform-origin: 160px 130px; }
  .ambient { animation: drift 6s ease-in-out infinite; }

  .screen {
    background: #0b0c0c;
    border-radius: 6px;
    padding: 16px;
    width: 360px;
    border: 1px solid #2a241a;
  }

  .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid #2a2a2a; }
  .brand { color:#c9a86a; font-size:10px; letter-spacing:4px; }
  .timer { color:#6b7a7c; font-size:10px; letter-spacing:2px; border:1px solid #333; padding:2px 8px; border-radius:2px; }

  .cluster-frame {
    position:relative;
    background: radial-gradient(ellipse at 50% 32%, #16332c 0%, #0f1614 45%, #0f0f0f 75%);
    border:1px solid #2a2a2a; border-radius:4px; padding:6px 4px; margin-bottom:14px; overflow:hidden;
  }
  .amb { position:absolute; border-radius:50%; }

  .stop-btn {
    width:100%; background:transparent; border:1px solid #c9a86a; color:#c9a86a;
    padding:13px; font-size:12px; letter-spacing:3px; font-weight:500; border-radius:2px; cursor:pointer;
  }
</style>
</head>
<body>

<div class="screen">

  <div class="header">
    <span class="brand">SHOKWAVE</span>
    <span class="timer">07:42</span>
  </div>

  <div class="cluster-frame">
    <div class="amb ambient" style="top:20px; left:30px; width:4px; height:4px; background:#00e5d1; box-shadow:0 0 6px #00e5d1;"></div>
    <div class="amb ambient" style="top:60px; right:40px; width:3px; height:3px; background:#ffb020; box-shadow:0 0 5px #ffb020; animation-delay:2s;"></div>
    <div class="amb ambient" style="bottom:40px; left:60px; width:3px; height:3px; background:#00e5d1; box-shadow:0 0 5px #00e5d1; animation-delay:4s;"></div>

    <svg width="100%" height="430" viewBox="0 0 320 430" style="overflow:visible;">
      <defs>
        <radialGradient id="dialMain" cx="50%" cy="38%" r="70%">
          <stop offset="0%" stop-color="#182420"/>
          <stop offset="60%" stop-color="#0d1210"/>
          <stop offset="100%" stop-color="#0a0a0a"/>
        </radialGradient>
        <radialGradient id="dialSmall" cx="50%" cy="35%" r="70%">
          <stop offset="0%" stop-color="#141414"/>
          <stop offset="100%" stop-color="#0a0a0a"/>
        </radialGradient>
      </defs>

      <!-- main gauge glow + body -->
      <polygon class="glow-pulse" points="160,4 275,72 275,190 160,258 45,190 45,72" fill="none" stroke="#00e5d1" stroke-width="26" opacity="0.4" style="filter:blur(22px);"/>
      <polygon class="glow-pulse" points="160,4 275,72 275,190 160,258 45,190 45,72" fill="none" stroke="#00e5d1" stroke-width="10" opacity="0.5" style="filter:blur(8px); animation-delay:0.3s;"/>
      <polygon points="160,4 275,72 275,190 160,258 45,190 45,72" fill="url(#dialMain)" stroke="#00e5d1" stroke-width="2"/>

      <!-- tick marks -->
      <g stroke="#5a6a6a" stroke-width="1.5">
        <line x1="160" y1="34" x2="160" y2="48"/>
        <line x1="248" y1="62" x2="238" y2="72"/>
        <line x1="266" y1="130" x2="252" y2="130"/>
        <line x1="248" y1="200" x2="238" y2="190"/>
        <line x1="160" y1="228" x2="160" y2="214"/>
        <line x1="72" y1="200" x2="82" y2="190"/>
        <line x1="54" y1="130" x2="68" y2="130"/>
        <line x1="72" y1="62" x2="82" y2="72"/>
      </g>

      <!-- inner progress arc -->
      <polygon points="160,58 220,90 220,164 160,196 100,164 100,90" fill="none" stroke="#1a1a1a" stroke-width="7"/>
      <path d="M 160 58 L 220 90 L 220 164 L 160 196" fill="none" stroke="#00e5d1" stroke-width="7" stroke-linecap="round" style="filter:drop-shadow(0 0 8px rgba(0,229,209,0.7));"/>

      <!-- speed readout -->
      <text x="160" y="123" text-anchor="middle" fill="#ffffff" font-size="44" font-weight="600">28</text>
      <text x="160" y="144" text-anchor="middle" fill="#00e5d1" font-size="10" letter-spacing="4">KM/U</text>

      <!-- needle (drawn after text so it sits in front) -->
      <g class="needle">
        <polygon points="160,130 165,133 202,100 160,124" fill="#ffb020" style="filter:drop-shadow(0 0 6px rgba(255,176,32,0.75));"/>
        <polygon points="160,130 155,133 143,140 160,136" fill="#a8781a"/>
        <circle cx="160" cy="130" r="8" fill="#1a1a1a" stroke="#ffb020" stroke-width="2"/>
        <circle cx="160" cy="130" r="3" fill="#ffb020"/>
      </g>

      <!-- accu + afstand (attached row) -->
      <polygon points="105,205 160,238 160,304 105,337 50,304 50,238" fill="url(#dialSmall)" stroke="#c9a86a" stroke-width="1.5"/>
      <polygon points="215,205 270,238 270,304 215,337 160,304 160,238" fill="url(#dialSmall)" stroke="#00e5d1" stroke-width="1.5" opacity="0.9"/>
      <path d="M 105 205 L 160 238 L 215 205" fill="none" stroke="#2a2418" stroke-width="1"/>

      <path d="M 77 246 L 77 296 L 105 313" fill="none" stroke="#ffb020" stroke-width="4" stroke-linecap="round" style="filter:drop-shadow(0 0 4px rgba(255,176,32,0.5));"/>
      <text x="105" y="278" text-anchor="middle" fill="#fff" font-size="22" font-weight="600">72</text>
      <text x="105" y="296" text-anchor="middle" fill="#c9a86a" font-size="8.5" letter-spacing="1.5">% ACCU</text>

      <path d="M 243 246 L 243 296 L 215 313" fill="none" stroke="#00e5d1" stroke-width="4" stroke-linecap="round" style="filter:drop-shadow(0 0 4px rgba(255,176,32,0.5));"/>
      <text x="215" y="278" text-anchor="middle" fill="#fff" font-size="22" font-weight="600">4.2</text>
      <text x="215" y="296" text-anchor="middle" fill="#00e5d1" font-size="8.5" letter-spacing="1.5">KM RIT</text>

      <!-- gyro / trilling / impacts row -->
      <polygon points="55,300 110,332 110,398 55,430 0,398 0,332" fill="url(#dialSmall)" stroke="#3a4a4a" stroke-width="1.3"/>
      <polygon points="160,300 215,332 215,398 160,430 105,398 105,332" fill="url(#dialSmall)" stroke="#3a4a4a" stroke-width="1.3"/>
      <polygon points="265,300 320,332 320,398 265,430 210,398 210,332" fill="url(#dialSmall)" stroke="#ff3b1f" stroke-width="1.6"/>

      <circle class="dot-flick" cx="55" cy="330" r="3" fill="#00e5d1"/>
      <text x="55" y="368" text-anchor="middle" fill="#c9d5d4" font-size="17" font-weight="500">2°</text>
      <text x="55" y="384" text-anchor="middle" fill="#5a6a6a" font-size="7.5" letter-spacing="1">GYRO</text>

      <text x="160" y="368" text-anchor="middle" fill="#c9d5d4" font-size="13" font-weight="500">rustig</text>
      <text x="160" y="384" text-anchor="middle" fill="#5a6a6a" font-size="7.5" letter-spacing="1">TRILLING</text>

      <circle class="dot-flick" cx="265" cy="330" r="3" fill="#ff5a3f" style="animation-delay:0.6s;"/>
      <text x="265" y="368" text-anchor="middle" fill="#ff5a3f" font-size="20" font-weight="600">0</text>
      <text x="265" y="384" text-anchor="middle" fill="#5a6a6a" font-size="7.5" letter-spacing="1">IMPACTS</text>
    </svg>
  </div>

  <button class="stop-btn">STOP RIT</button>

</div>

</body>
</html>
